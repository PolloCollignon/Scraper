name: Ejecutar scraper dos veces al día

on:
  schedule:
    - cron: "0 17 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # 🔥 Descargar DB anterior
      - name: Download previous DB
        uses: actions/download-artifact@v4
        with:
          name: inventario-db
          path: .
        continue-on-error: true

      # 🔥 FIX REAL (sin multilinea complicada)
      - name: Fix DB path
        run: mv inventario-db/inventario.db inventario.db || true

      - name: Ejecutar el script
        run: python scraper.py

      # 🔥 Subir DB actualizada
      - name: Upload DB
        uses: actions/upload-artifact@v4
        with:
          name: inventario-db
          path: inventario.db
